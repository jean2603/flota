<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta de Vehículos</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #bebebe;
      color: #333;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #800000;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    main {
      padding: 2rem;
      max-width: 1000px;
      margin: auto;
    }
    h2 { margin-top: 0; }

    select {
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #800000;
      color: white;
    }
    tr:hover { background-color: #f1f1f1; }

    .nav {
      text-align: center;
      margin-top: 2rem;
    }
    .nav a {
      background-color: #800000;
      color: white;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 5px;
    }

    .btn-salir {
      background-color: #800000;
      color: white;
      padding: 0.6rem 1.5rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-salir:hover { background-color: #a30000; }

    /* Resaltado por vencimiento */
    .rojo { background-color: #f8d7da !important; }
    .amarillo { background-color: #fff3cd !important; }
    .verde { background-color: #d4edda !important; }

    /* Botones de acción con íconos */
    .acciones {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .icon-btn {
      width: 40px;
      height: 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .05s ease, filter .15s ease;
    }
    .icon-btn:active { transform: scale(0.98); }
    .icon-btn:hover { filter: brightness(0.95); }

    .btn-edit { background-color: #28a745; }  /* verde */
    .btn-del  { background-color: #dc3545; }  /* rojo */
    .icon-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }
    .modal {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .modal-header {
      background: #800000;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .modal-close {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body {
      padding: 16px;
    }
    .form-row { margin-bottom: 12px; }
    .form-row label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .form-row input, .form-row textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .form-row textarea { min-height: 90px; resize: vertical; }

    .modal-actions {
      padding: 0 16px 16px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-primary   { background: #28a745; color: #fff; }
    .btn-secondary:hover, .btn-primary:hover { filter: brightness(0.95); }
  </style>
</head>
<body>
  <header>
    <h1>Consulta de Vehículos</h1>
  </header>

  <main>
    <h2>Selecciona una Placa</h2>
    <select id="placaSelect" onchange="mostrarDocumentos()"></select>

    <table>
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Fecha de Vencimiento</th>
          <th>Detalle</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tablaDocumentos">
        <tr><td colspan="4">Seleccione una placa para ver los documentos</td></tr>
      </tbody>
    </table>

    <div class="nav">
      <a href="registro.html">Volver al Registro</a>
    </div>
    <div class="nav">
      <a href="index.html" class="btn-salir">Salir</a>
    </div>
  </main>

  <!-- MODAL EDITAR -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Editar documento</h3>
        <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label for="editTipo">Tipo</label>
          <input id="editTipo" type="text" placeholder="Ej. SOAT" />
        </div>
        <div class="form-row">
          <label for="editFecha">Fecha de vencimiento</label>
          <input id="editFecha" type="date" />
        </div>
        <div class="form-row">
          <label for="editDetalle">Detalle</label>
          <textarea id="editDetalle" placeholder="Detalle del documento..."></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarEdicion()">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD4jXuHsXsK2eP6wnWIpbyQ2oC-vWNLnn0",
      authDomain: "flota-fcg.firebaseapp.com",
      projectId: "flota-fcg",
      storageBucket: "flota-fcg.firebasestorage.app",
      messagingSenderId: "1028149868248",
      appId: "1:1028149868248:web:95a63df6dcd1f4007f49ad",
      measurementId: "G-YDSZTH1LXF"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let placaActual = '';
    let indexEditando = -1; // ESTE será el índice ORIGINAL, no el del ordenado

    const iconPencil = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.83H5v-.92l9.06-9.06.92.92L5.92 20.08zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
      </svg>
    `;
    const iconTrash = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2zM9 9h2v10H9V9zm4 0h2v10h-2V9z"/>
      </svg>
    `;

    async function cargarPlacas() {
      const select = document.getElementById('placaSelect');
      select.innerHTML = '<option value="">-- Selecciona --</option>';

      const snapshot = await db.collection("vehiculos").get();
      snapshot.forEach(doc => {
        const option = document.createElement('option');
        option.value = doc.id;
        option.textContent = doc.id;
        select.appendChild(option);
      });
    }

    function calcularClaseColorPorFecha(fechaISO) {
      const fechaVenc = new Date(fechaISO);
      const hoy = new Date();
      hoy.setHours(0,0,0,0);

      const diferenciaDias = Math.ceil((fechaVenc - hoy) / (1000 * 60 * 60 * 24));
      if (diferenciaDias < 0) return 'rojo';
      if (diferenciaDias <= 7) return 'rojo';
      if (diferenciaDias <= 30) return 'amarillo';
      return 'verde';
    }

    async function mostrarDocumentos() {
      placaActual = document.getElementById('placaSelect').value;
      const tbody = document.getElementById('tablaDocumentos');
      tbody.innerHTML = '';

      if (!placaActual) {
        tbody.innerHTML = '<tr><td colspan="4">Seleccione una placa para ver los documentos</td></tr>';
        return;
      }

      const docRef = db.collection("vehiculos").doc(placaActual);
      const docSnap = await docRef.get();

      if (!docSnap.exists) {
        tbody.innerHTML = '<tr><td colspan="4">No se encontraron documentos</td></tr>';
        return;
      }

      const documentos = docSnap.data().documentos || [];
      if (documentos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4">No hay documentos registrados para esta placa</td></tr>';
        return;
      }

      // ✅ Creamos una "vista" con el índice original
      const vista = documentos.map((d, i) => ({ ...d, __origIndex: i }));

      // ✅ Ordenamos SOLO la vista
      vista.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));

      vista.forEach((item) => {
        const claseColor = calcularClaseColorPorFecha(item.fecha);
        const origIndex = item.__origIndex; // 👈 este es el que usaremos para editar/eliminar

        const row = document.createElement('tr');
        row.classList.add(claseColor);

        row.innerHTML = `
          <td>${item.tipo ?? ''}</td>
          <td>${item.fecha ?? ''}</td>
          <td>${item.detalle ?? ''}</td>
          <td>
            <div class="acciones">
              <button class="icon-btn btn-edit" title="Editar" onclick="abrirModalEditar('${placaActual}', ${origIndex})">
                ${iconPencil}
              </button>
              <button class="icon-btn btn-del" title="Eliminar" onclick="eliminarDocumento('${placaActual}', ${origIndex})">
                ${iconTrash}
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function eliminarDocumento(placa, origIndex) {
      const ok = confirm("¿Seguro que deseas eliminar este documento?");
      if (!ok) return;

      const docRef = db.collection("vehiculos").doc(placa);
      const docSnap = await docRef.get();
      const documentos = (docSnap.data().documentos || []);

      documentos.splice(origIndex, 1);

      await docRef.set({ documentos }, { merge: true });

      alert("Documento eliminado correctamente");
      mostrarDocumentos();
    }

    async function abrirModalEditar(placa, origIndex) {
      placaActual = placa;
      indexEditando = origIndex; // ✅ Guardamos el índice ORIGINAL

      const docRef = db.collection("vehiculos").doc(placa);
      const docSnap = await docRef.get();
      const documentos = (docSnap.data().documentos || []);

      const item = documentos[indexEditando];
      if (!item) {
        alert("No se encontró el documento a editar.");
        return;
      }

      document.getElementById('editTipo').value = item.tipo ?? '';
      document.getElementById('editFecha').value = item.fecha ?? '';
      document.getElementById('editDetalle').value = item.detalle ?? '';

      document.getElementById('modalOverlay').style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modalOverlay').style.display = 'none';
      indexEditando = -1;
    }

    async function guardarEdicion() {
      if (!placaActual || indexEditando < 0) return;

      const tipo = document.getElementById('editTipo').value.trim();
      const fecha = document.getElementById('editFecha').value;
      const detalle = document.getElementById('editDetalle').value.trim();

      if (!tipo || !fecha) {
        alert("Completa Tipo y Fecha de vencimiento.");
        return;
      }

      const docRef = db.collection("vehiculos").doc(placaActual);
      const docSnap = await docRef.get();
      const documentos = (docSnap.data().documentos || []);

      if (!documentos[indexEditando]) {
        alert("No se encontró el documento a editar.");
        return;
      }

      documentos[indexEditando] = { tipo, fecha, detalle };

      await docRef.set({ documentos }, { merge: true });

      alert("Documento actualizado correctamente");
      cerrarModal();
      mostrarDocumentos();
    }

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') cerrarModal();
    });

    window.onload = cargarPlacas;
  </script>
</body>
</html>
