<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #bebebe;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    header {
      background-color: #800000;
      color: white;
      padding: 1rem;
      border-radius: 10px 10px 0 0;
    }
    input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background-color: #800000;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #a00000;
    }
    .logo {
      margin-bottom: 1.5rem;
      width: 50%;
    }
    .footer {
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #777;
    }
    .footer a {
      text-decoration: none;
      color: #800000;
    }
    .footer button {
      width: 100%;
      padding: 0.8rem;
      background-color: #777;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .footer button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <header>
      <img src="Imagenes/logofcg.jpg" alt="Logo" class="logo" />
      <h2>Iniciar Sesión</h2>
    </header>
    <form id="loginForm">
      <input type="text" id="usuario" placeholder="Usuario" required>
      <input type="password" id="clave" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>
    
    <!-- Botón de invitado -->
    <div class="footer">
      <button id="btnInvitado" onclick="ingresarComoInvitado()">Ingresar como Invitado</button>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value;
      const clave = document.getElementById('clave').value;

      if (usuario === 'admin' && clave === 'FCG1234') {
        // Si las credenciales son correctas
        localStorage.setItem('usuario', 'admin');
        window.location.href = 'Paginas/registro.html';
      } else {
        // Si las credenciales no son correctas
        alert('Credenciales incorrectas. Ingresa como invitado si lo deseas.');
      }
    });

    function ingresarComoInvitado() {
      localStorage.setItem('usuario', 'invitado');
      window.location.href = 'Paginas/invitado.html'; // Redirige a la página como invitado
    }
  </script>
</body>
</html>
